{% extends "base.html" %}

{% block title %}Confirm Delete | Epsilon LMS{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 max-w-lg">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
        <h1 class="text-xl font-bold text-red-600 mb-2">Delete {{ type }}</h1>
        <p class="text-sm text-gray-600 mb-6">Are you sure you want to delete <strong>"{{ object }}"</strong>? This action cannot be undone.</p>
        
        <form method="post" class="flex justify-center space-x-4">
            {% csrf_token %}
            <a href="javascript:history.back()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-50 transition">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition">Confirm Delete</button>
        </form>
    </div>
</div>
{% endblock %}
