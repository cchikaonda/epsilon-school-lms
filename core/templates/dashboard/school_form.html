{% extends "base.html" %}

{% block title %}Edit School | Epsilon LMS{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Edit School Tenant</h1>
            <p class="text-sm text-gray-600">Update configuration settings for <strong>{{ school.name }}</strong>.</p>
        </div>
        <a href="{% url 'school_manage' %}" class="text-sm text-emerald-600 hover:underline">&larr; Back to Schools</a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="pt-4 flex space-x-3">
                <button type="submit" class="py-2 px-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium shadow-sm transition">
                    Save Changes
                </button>
                <a href="{% url 'school_manage' %}" class="py-2 px-4 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
